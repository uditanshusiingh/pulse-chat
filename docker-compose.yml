services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
  api:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/pulse-chat
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    ports: ["5000:5000"]
    depends_on: [mongo]
  web:
    build: ./client
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  mongo-data:
